name: CI - Lint, Test & Build

on:
  push:
    branches: ["main", "lab10"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Node 24 + PostgreSQL 17 Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shop_user
          POSTGRES_PASSWORD: shop_password
          POSTGRES_DB: shop_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shop_user -d shop_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: "postgresql://shop_user:shop_password@localhost:5432/shop_test_db?schema=public"
      TEST_DATABASE_URL: "postgresql://shop_user:shop_password@localhost:5432/shop_test_db?schema=public"
      BETTER_AUTH_SECRET: "9SqhCtBCocv1yCRNie3IZsZLbr/JShkTFPUxUqdUvZk="
      BETTER_AUTH_URL: "http://localhost:3000"
      GITHUB_CLIENT_ID: "Ov23liIjWbFlfPCW2GOU"
      GITHUB_CLIENT_SECRET: "da246bc33183d8da0423574168cfe26b1d93d6b4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Clean install dependencies (npm ci)
        run: npm ci

      - name: Generate Prisma Client
        run: npx --no-install prisma generate

      - name: Apply migrations to test database (prisma migrate deploy)
        run: npx --no-install prisma migrate deploy

      - name: Run ESLint
        run: npm run lint

      - name: Run Integration Tests (Vitest)
        run: npm run test

      - name: Run Pool & Concurrency Benchmark
        run: npm run benchmark

      - name: Build Production Next.js Application
        run: npm run build